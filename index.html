<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEONVERSE</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050510;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    position: absolute;
    inset: 0;
}

.title {
    position: absolute;
    top: 40%;
    width: 100%;
    text-align: center;
    pointer-events: none;
}

h1 {
    font-size: clamp(45px, 10vw, 100px);
    letter-spacing: 15px;
    color: white;
    text-shadow:
        0 0 10px #8b5cf6,
        0 0 30px #6366f1,
        0 0 70px #8b5cf6;
}

p {
    margin-top: 20px;
    color: #aaa;
    letter-spacing: 5px;
    font-size: 12px;
}

footer {
    position: absolute;
    bottom: 25px;
    width: 100%;
    text-align: center;
    color: #666;
    font-size: 11px;
    letter-spacing: 3px;
}
</style>
</head>

<body>

<canvas id="universe"></canvas>

<div class="title">
    <h1>NEONVERSE</h1>
    <p>EXPLORE THE UNKNOWN</p>
</div>

<footer>MOVE YOUR MOUSE • CLICK TO CREATE ENERGY</footer>

<script>
const canvas = document.getElementById("universe");
const ctx = canvas.getContext("2d");

let stars = [];
let mouse = { x: -1000, y: -1000 };

function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    stars = [];

    for (let i = 0; i < 180; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 0.5 + 0.2
        });
    }
}

function createExplosion(x, y) {
    for (let i = 0; i < 35; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 5 + 1;

        stars.push({
            x, y,
            size: Math.random() * 3 + 1,
            speed,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1
        });
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    stars.forEach((star, i) => {
        if (star.life !== undefined) {
            star.x += star.vx;
            star.y += star.vy;
            star.life -= 0.015;

            if (star.life <= 0) {
                stars.splice(i, 1);
                return;
            }
        } else {
            star.y -= star.speed;

            if (star.y < 0) {
                star.y = canvas.height;
                star.x = Math.random() * canvas.width;
            }
        }

        let dx = mouse.x - star.x;
        let dy = mouse.y - star.y;
        let distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < 120) {
            star.x -= dx * 0.015;
            star.y -= dy * 0.015;
        }

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);

        ctx.fillStyle = star.life !== undefined
            ? `rgba(180,100,255,${star.life})`
            : "#a5a5ff";

        ctx.shadowBlur = 15;
        ctx.shadowColor = "#8050ff";
        ctx.fill();
    });

    ctx.shadowBlur = 0;
    requestAnimationFrame(animate);
}

window.addEventListener("mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

window.addEventListener("click", e => {
    createExplosion(e.clientX, e.clientY);
});

window.addEventListener("resize", resize);

resize();
animate();
</script>

</body>
</html>
